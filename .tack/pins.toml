[shorturls]
gh = "github:{path}"
manic = "github:manic-systems/{path}"

[all_follow]
nixpkgs = ["nixos-stable", "master"]
niri-src = ["niri-stable", "niri-unstable"]
crane = "crane"
nixpkgs-lib = "nixpkgs-lib"
xwayland-satellite = [
  "xwayland-satellite-stable",
  "xwayland-satellite-unstable"
]
hjem-rum = "hjem"
smithay = "smithay"

[inputs]
# --- Core toolchain ----------------------------------------------------------
nixpkgs.url = "gh:nixos/nixpkgs/nixos-unstable"
master.url = "gh:nixos/nixpkgs/master"
nixos-stable.url = "https://channels.nixos.org/nixos-26.05/nixexprs.tar.xz"

# --- Secrets / identity ------------------------------------------------------
agenix.url = "gh:ryantm/agenix"

# --- Build / system ----------------------------------------------------------
nixos-core.url = "github:llakala/nixos-core"
run0-sudo-shim.url = "gh:amaanq/run0-sudo-shim/sudoedit"
tack.url = "manic:tack"

# --- Misc personal flakes ----------------------------------------------------
spicetify.url = "gh:Gerg-L/spicetify-nix"
helium-browser.url = "gh:oxcl/nix-flake-helium-browser"
nixcord.url = "gh:FlameFlag/nixcord"

# --- Niri / desktop ----------------------------------------------------------
niri-nix.url = "git+https://codeberg.org/BANanaD3V/niri-nix"
niri-src.url = "gh:YaLTeR/niri"
tuigreet.url = "gh:notashelf/tuigreet"
watt.url = "gh:notashelf/watt"
noctalia.url = "gh:noctalia-dev/noctalia-shell/cachix"
noctalia-greeter.url = "gh:noctalia-dev/noctalia-greeter"
# --- System services ---------------------------------------------------------
qtengine.url = "gh:kossLAN/qtengine"
quickshell.url = "git+https://git.outfoxxed.me/quickshell/quickshell.git"
hjem-impure.url = "github:Rexcrazy804/hjem-impure"
hjem-rum.url = "github:snugnug/hjem-rum"
hjem.url = "github:feel-co/hjem"
sysc-greet.url = "github:kagurazakei/sysc-greet/master"
ambxst.url = "github:kagurazakei/ambxst"
viu.url = "gh:viu-media/viu"
neovim-nightly.url = "gh:nix-community/neovim-nightly-overlay"
catp-bat.url = "gh:catppuccin/bat"
chaotic.url = "gh:chaotic-cx/nyx/nyxpkgs-unstable"
flake-utils.url = "gh:numtide/flake-utils"
impermanence.url = "gh:nix-community/impermanence"
mango.url = "gh:mangowm/mango"
mnw.url = "gh:Gerg-L/mnw"
nix-cachyos-kernel.url = "gh:xddxdd/nix-cachyos-kernel"
nix-flatpak.url = "gh:gmodena/nix-flatpak"
nix-index-database.url = "gh:nix-community/nix-index-database"
nixos-hardware.url = "gh:Nixos/nixos-hardware"
rosep-fish.url = "gh:rose-pine/fish"
shizuruPkgs.url = "gh:kagurazakei/shizuruPkgs"
stash.url = "gh:NotAShelf/stash"
waifu-cursors.url = "gh:kagurazakei/waifu-cursors"

# --- Fetch types -------------------------------------------------------------
rosep-kitty = { url = "gh:rose-pine/kitty", type = "fetch" }
rosep-foot = { url = "gh:rose-pine/foot", type = "fetch" }
hyprview = { url = "github:kagurazakei/quickshell-overview", type = "fetch" }
npins = { url = "gh:andir/npins", type = "fetch" }
cat-gtk-themes = { url = "gh:kagurazakei/cat-gtk-themes", type = "fetch" }
walls = { url = "git+https://github.com/kagurazakei/walls.git", type = "fetch" }
equibop = { url = "gh:Equicord/Equibop", type = "fetch" }
equicord = { url = "gh:Equicord/Equicord", type = "fetch" }
